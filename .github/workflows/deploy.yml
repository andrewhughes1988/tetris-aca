name: "Tetris CI/CD - Terraform Deploy"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write       # Required for Entra ID OIDC Federated authentication
  pull-requests: write

jobs:
  # Deploy Infrastructure on Azure Container Apps + Cloudflare via OIDC
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.ARM_TENANT_ID }}

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.ARM_TENANT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD_AUTH: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.ARM_TENANT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
